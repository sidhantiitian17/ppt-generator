name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install
      - name: Lint
        run: poetry run ruff check app/backend
      - name: Type check
        run: poetry run mypy app/backend
      - name: Test
        run: poetry run pytest tests/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd app/frontend
          npm install
      - name: Lint
        run: |
          cd app/frontend
          npm run lint
      - name: Test
        run: |
          cd app/frontend
          npm run test -- --run
      - name: Build
        run: |
          cd app/frontend
          npm run build

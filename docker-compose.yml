version: "3.9"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      ENABLE_OCR: "0"
      PREVIEW_CACHE_MB: "200"
      PREVIEW_TTL_SEC: "3600"
      MAX_UPLOAD_MB: "30"
    volumes:
      - ./var:/app/var
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional heavy OCR/inpainting sidecar; build separately when ENABLE_OCR=1
  ocr:
    image: placeholder/ocr-sidecar:latest
    profiles: [ocr]
    environment:
      - TZ=UTC

[tool.poetry]
name = "ppt-generator"
version = "0.1.0"
description = "Scaffolding for PPT generator"
authors = ["Auto"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
reportlab = "^4.0.8"
pydantic = "^1.10.14"
python-multipart = "^0.0.6"
pillow = "^10.2.0"
python-pptx = "^0.6.23"
pymupdf = "^1.23.8"
pypdf = "^3.17.4"
numpy = "^1.26.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
httpx = "^0.26.0"
ruff = "^0.1.11"
mypy = "^1.7.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
